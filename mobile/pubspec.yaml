name: splitit
description: Splitwise-style expense splitting app with real-time sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.0

  # API & Networking
  dio: ^5.9.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  
  # Real-time
  socket_io_client: ^3.1.4

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Authentication
  google_sign_in: ^6.2.2

  # Push Notifications
  onesignal_flutter: ^5.2.7

  # Forms
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.0.0

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI Utilities
  intl: ^0.20.3
  timeago: ^3.7.0
  
  # Freezed (immutable models)
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0
  retrofit_generator: ^9.1.2
  json_serializable: ^6.8.0
  freezed: ^2.5.7

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # If you want to add assets (images, fonts, etc.), uncomment and configure:
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
